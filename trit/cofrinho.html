<body>
    <div class="menu">
        <a href="">
            <img src="img/menu/calendario.svg" alt="calendario">
        </a>
        <a href="cofrinho.html" class="selecionado">
            <img src="img/menu/cofre.svg" alt="cofre">
        </a>
        <a href="home.html">
            <img src="img/menu/home.svg" alt="home">
        </a>
        <a href="">
            <img src="img/menu/extrato.svg" alt="extrato">
        </a>
        <a href="">
            <img src="img/menu/perfil.svg" alt="perfil">
        </a>
    </div>

    <header>
        <img src="img/logo3.png" alt="logo trit">
    </header>

    <div class="guia">
        <p>home</p>
        <p>></p>
        <p>cofrinho</p>
    </div>

    <main>

        <p class="titulo tituloPagina">Cofrinhos</p>

        <section class="cofrinhos">
            <div class="plantaPrateleira">
                <div class="plantas">
                    <div class="areaAdicionar">
                        <img src="img/adicionar.svg" alt="" class="btnAdicionar">
                        <img src="img/plantas/vaso.svg" alt="">
                    </div>

                    <div class="planta">
                        <img src="img/plantas/lirio/lirio-f3.svg" alt="">
                        <img src="img/plantas/vaso.svg" alt="">
                        <p class="porcentagem">40%</p>
                    </div>

                    <div class="planta">
                        <img src="img/timer-icon.svg" alt="" class="determinado status">
                        <img src="img/plantas/cacto/cacto-f4.svg" alt="">
                        <img src="img/plantas/vaso.svg" alt="">
                        <p class="porcentagem">59%</p>
                    </div>
                </div>

                <div class="prateleira">
                    <p class="tituloAdicionar"></p>
                    <p class="tituloCofre">Casa própria</p>
                    <p class="tituloCofre">Entrada da moto</p>
                </div>
            </div>

            <div class="plantaPrateleira">
                <div class="plantas">
                    <div class="planta">
                        <img src="img/plantas/peonia/peonia-f5.svg" alt="">
                        <img src="img/plantas/vaso.svg" alt="">
                        <p class="porcentagem">99%</p>
                    </div>

                    <div class="planta">
                        <img src="img/plantas/zamioculca/zamioculca-f4.svg" alt="">
                        <img src="img/plantas/vaso.svg" alt="">
                        <p class="porcentagem">63%</p>
                    </div>

                    <div class="planta">
                        <img src="img/plantas/peonia/peonia-f1.svg" alt="">
                        <img src="img/plantas/vaso.svg" alt="">
                        <p class="porcentagem">2%</p>
                    </div>
                </div>

                <div class="prateleira">
                    <p class="tituloCofre">Jogo</p>
                    <p class="tituloCofre">Tatuagem</p>
                    <p class="tituloCofre">Algo muito legal</p>
                </div>
            </div>
        </section>
        
    </main>

    <script src="js/cofrinho.js"></script>
