<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trit</title>
    <link rel="icon" href="img/logo1.png">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@1..900&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
</head>
<body>

    <div class="menu">
        <a href="">
            <img src="img/menu/calendario.svg" alt="calendario">
        </a>
        <a href="">
            <img src="img/menu/cofre.svg" alt="cofre">
        </a>
        <a href="home.html" class="selecionado">
            <img src="img/menu/home.svg" alt="home">
        </a>
        <a href="">
            <img src="img/menu/extrato.svg" alt="extrato">
        </a>
        <a href="">
            <img src="img/menu/perfil.svg" alt="perfil">
        </a>
    </div>

    <header>
        <img src="img/logo3.png" alt="logo trit">
    </header>

    <p class="guia">home</p>

    <main>

        <div class="areaGalho">
            <img src="img/galho/galho-f1.png" alt="galho de gastos" id="galho">

            <div class="areaRenda">
                <div class="valor">
                    <p>R$</p>
                    <p id="valorAtual">4000,00</p>
                </div>
                <div class="linha"></div>
                <div class="valor">
                    <p>R$</p>
                    <p id="valorTotal">5500,00</p>
                </div>
            </div>
        </div>

        <div class="areaBotoes">
            <button id="novaSaida">Nova saída</button>
            <button id="novaEntrada">Nova entrada</button>
        </div>

        <section id="areaControlados">
            <p class="titulo">Gastos controlados</p>

            <div class="card controlado">
                <div class="infosControlado">
                    <div class="tituloControlado">
                        <p>Lazer</p>
                        <div class="valorControlado">
                            <div>
                                <p id="valorAtualControladoMoeda">R$</p>
                                <p id="valorAtualControlado">75,00</p>
                            </div>
                            <p>/</p>
                            <div>
                                <p>R$</p>
                                <p id="valorTotalControlado">120,00</p>
                            </div>
                        </div>
                    </div>
                    <progress value="0" max="100"></progress>
                </div>
                <img src="img/seta.png" alt="">
            </div>
        </section>

        <section id="areaFixos">
            <p class="titulo">Gastos fixos</p>

            <div class="card fixo">
                <div class="infosFixo">
                    <div class="left">
                        <p>Celular</p>
                        <p class="subtxt">R$ 90,00</p>
                    </div>

                    <div class="center">
                        <p>Frequência</p>
                        <p class="subtxt">03/06 parcelas</p>
                    </div>

                    <div class="right">
                        <p>Vencimento</p>
                        <p class="subtxt">28/08/2016</p>
                    </div>
                </div>

                <img src="img/seta.png" alt="">
            </div>
        </section>

    </main>

    <script src="js/home.js"></script>
</body>
</html>
