<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trit</title>
    <link rel="icon" href="img/logo1.png">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/conta.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@1..900&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="menu">
        <a href="calendario.html">
            <img src="img/menu/calendario.svg" alt="calendario">
        </a>
        <a href="cofrinho.html">
            <img src="img/menu/cofre.svg" alt="cofre">
        </a>
        <a href="home.html">
            <img src="img/menu/home.svg" alt="home">
        </a>
        <a href="extrato.html">
            <img src="img/menu/extrato.svg" alt="extrato">
        </a>
        <a href="conta.html" class="selecionado">
            <img src="img/menu/perfil.svg" alt="perfil">
        </a>
    </div>

    <header>
        <img src="img/logo3.png" alt="logo trit">
    </header>

    <div class="guia">
        <p>home</p>
        <p>></p>
        <p>conta</p>
    </div>

    <main>
        <div class="areaPerfil">
            <div class="perfilImg">
                <img src="img/folha-icon.svg" alt="">
            </div>

            <div class="areaNome">
                <p class="nome">Xovilson</p> 
                <img src="img/editar-perfil.svg" alt="" class="btnEditar">
            </div>
        </div>

        <div class="areaProgresso">
            <div class="areaNivel">
                <p id="nivelAtual">Nível 1</p>
                <p id="proximoNivel">Nível 2</p>
            </div>
            <div class="barraProgresso">
                <p class="tarefasConcluidas">5/15</p>
                <progress value="50" max="100"></progress>
            </div>            
        </div>

        <div class="desafios">
            <p class="tituloMenor tituloPagina">Desafios de nível</p>
            <div class="areaDesafios">
                <div class="desafio">
                    <div class="checkbox">
                        <img src="img/check-icon.svg" alt="">
                    </div>
                    <p for="">Completas 3 metas</p>
                </div>

                <div class="desafio">
                    <div class="checkbox">
                        <img src="img/check-icon.svg" alt="">
                    </div>
                    <p for="">Economizar R$30,00</p>
                </div>
            </div>
        </div>

        <div class="areaInsignias">
            <p class="tituloGeral tituloPagina">Insígnias</p>

            <div class="areaInsigniaTipo">
                <div class="tituloInsignias">
                    <p>Aumento de nível</p>
                    <img src="img/seta.svg" alt="">
                </div>
                <div class="insignias nivel">
                    <img src="img/insignias/nivel-0.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/nivel-1.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/nivel-2.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/nivel-3.svg" alt="" class="naoPossui insignia">
                </div>
            </div>

            <div class="areaInsigniaTipo">
                <div class="tituloInsignias">
                    <p>Metas alcançadas</p>
                    <img src="img/seta.svg" alt="">
                </div>
                <div class="insignias metas">
                    <img src="img/insignias/metas-0.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/metas-1.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/metas-2.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/metas-3.svg" alt="" class="naoPossui insignia">
                    <img src="img/insignias/metas-4.svg" alt="" class="naoPossui insignia">
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="js/conta.js"></script>
    
</body>
</html>
